<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>probe</title>
<style>
  html,body{margin:0;background:#fff;font:13px/1.4 "Consolas",monospace;color:#111}
  iframe{border:0;display:block}
  #out{margin:0;padding:8px 10px;white-space:pre;background:#fff}
  body.plain #out{display:none}
</style>
</head>
<body>
<!-- 临时测量页（不属于交付物）：把一个真实尺寸的 iframe 指向 index.html，
     在父页面打印内层几何。?w=1024&h=900 控制 iframe 尺寸；?q=田 预填搜索词；
     ?plain=1 时不显示测量面板（只做视觉截图）。 -->
<pre id="out">measuring…</pre>
<iframe id="f" width="1440" height="900"></iframe>
<script>
(function () {
  var qp = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  if (qp.get('w')) f.width = Number(qp.get('w'));
  if (qp.get('h')) f.height = Number(qp.get('h'));
  if (qp.get('plain')) document.body.className = 'plain';
  var q = qp.get('q') || '';
  var done = false;

  function num(v) { return (Math.round(Number(v) * 100) / 100); }

  function run() {
    var w = f.contentWindow, d = f.contentDocument;
    var out = [];
    function g(sel, label) {
      var el = d.querySelector(sel);
      if (!el) { out.push(label + ' :: MISSING ' + sel); return; }
      var r = el.getBoundingClientRect();
      var cs = w.getComputedStyle(el);
      out.push(label + ' :: x=' + num(r.x) + ' y=' + num(r.y) + ' w=' + num(r.width) + ' h=' + num(r.height) +
        ' | pad=' + cs.padding + ' font=' + cs.fontSize + '/' + cs.lineHeight + ' color=' + cs.color);
    }
    var view = d.querySelector('.view');
    var vs = view ? w.getComputedStyle(view) : null;
    var contentEl = d.querySelector('#content');
    var ci = d.querySelector('.content-inner');
    out.push('route=' + (location.hash || '#/home') + '  vw=' + w.innerWidth + 'x' + w.innerHeight);
    out.push('view.class=' + (view ? view.className : '-'));
    out.push('shell :: content.w=' + (contentEl ? num(contentEl.getBoundingClientRect().width) : '-') +
      ' contentInset=' + (contentEl ? w.getComputedStyle(contentEl).getPropertyValue('--content-inset') : '-') +
      ' inner.w=' + (ci ? num(ci.getBoundingClientRect().width) : '-') +
      ' inner.pad=' + (ci ? w.getComputedStyle(ci).padding : '-'));
    out.push('vars :: gutter=' + (vs ? vs.getPropertyValue('--vh-gutter') : '-') +
      ' col=' + (vs ? vs.getPropertyValue('--vh-col') : '-') +
      ' hero=' + (vs ? vs.getPropertyValue('--vh-hero') : '-') +
      ' shelf=' + (vs ? vs.getPropertyValue('--vh-shelf-cols') : '-') +
      ' plcols=' + (vs ? vs.getPropertyValue('--vh-plcols') : '-') +
      ' albumcols=' + (vs ? vs.getPropertyValue('--vh-album-cols') : '-') +
      ' wide=' + (view ? view.classList.contains('vh-wide') : '-'));
    g('.vh-page', 'page');
    g('.vh-col', 'col');
    g('.vh-hero__title', 'hero-title');
    g('.vh-hero__body', 'hero-body');
    g('.vh-heading', 'heading');
    g('.vh-shelf', 'shelf');
    g('.vh-shelf__card', 'shelf-card');
    g('.vh-shelf__cover', 'shelf-cover');
    g('.vh-pgrid', 'pgrid');
    g('.vh-pcard', 'pcard');
    g('.vh-rowstack', 'rowstack');
    g('.vh-row', 'row');
    g('.vh-row__main', 'row-main');
    g('.vh-row__album', 'row-album');
    g('.vh-agrid', 'agrid');
    g('.vh-acard', 'acard');
    g('.vh-acard__art', 'acard-art');
    g('.vh-acard__play', 'acard-play');
    g('.vh-search__field', 'search-field');
    g('.vh-search__body', 'search-body');
    g('.vh-search__group', 'search-group');
    g('.vh-media', 'media');
    g('.vh-empty', 'empty');
    g('.vh-pl__head', 'pl-head');
    g('.vh-pl__cover', 'pl-cover');
    g('.vh-pl__title', 'pl-title');
    g('.vh-pl__table', 'pl-table');
    g('.vh-pl__rows .vh-row', 'pl-row');
    g('.vh-appbar', 'appbar');
    g('.vh-detail__head', 'd-head');
    g('.vh-detail__cover', 'd-cover');
    g('.vh-detail__title', 'd-title');
    g('.vh-cta', 'cta');
    g('.vh-detail__rows .vh-row', 'd-row');
    document.getElementById('out').textContent = out.join('\n');
  }

  function tryRun() {
    if (done) return;
    try {
      var d = f.contentDocument;
      if (d && d.querySelector('#content') && d.querySelector('.view')) {
        done = true;
        setTimeout(run, 800);
        return;
      }
    } catch (e) {}
    setTimeout(tryRun, 150);
  }

  f.addEventListener('load', function () {
    if (q) {
      setTimeout(function () {
        var d = f.contentDocument;
        var input = d.querySelector('.vh-search__input');
        if (!input) return;
        input.value = q;
        input.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true }));
      }, 500);
    }
    tryRun();
  });

  f.src = 'index.html?x=' + Date.now() + (location.hash || '#/home');
})();
</script>
</body>
</html>
